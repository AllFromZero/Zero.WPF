name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'               # 推送 v1.0.0, v2.0.0-beta 等标签触发
  workflow_dispatch:        # 允许手动触发（测试用）

env:
  PROJECT_PATH: 'Zero.WPF.csproj'
  PACKAGE_OUTPUT_DIR: '${{ github.workspace }}/output'
  NUGET_SOURCE: 'https://api.nuget.org/v3/index.json'

jobs:
  build-and-publish:
    name: Build, Pack, and Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write        # 用于创建 GitHub Release
      id-token: write        # 🔑 用于 OIDC 身份验证（Trusted Publishing）

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0       # 获取所有历史（如果需要从 Git 元数据生成版本号）

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # 可选：缓存 NuGet 包
    - name: Cache NuGet packages
      uses: actions/cache@v3
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore ${{ env.PROJECT_PATH }}

    - name: Run tests (optional)
      run: dotnet test ${{ env.PROJECT_PATH }} --no-restore --verbosity normal

    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

    - name: Build and Pack
      run: |
        dotnet pack ${{ env.PROJECT_PATH }} \
          --configuration Release \
          --no-build \
          --output ${{ env.PACKAGE_OUTPUT_DIR }} \
          -p:PackageVersion=${{ steps.get_version.outputs.VERSION }} \
          -p:IncludeSymbols=true \
          -p:SymbolPackageFormat=snupkg \
          -p:ContinuousIntegrationBuild=true

    # ✅ 使用 OIDC (Trusted Publishing) 推送，无需 API Key
    - name: Push to NuGet.org
      run: |
        dotnet nuget push "${{ env.PACKAGE_OUTPUT_DIR }}/*.nupkg" \
          --source ${{ env.NUGET_SOURCE }} \
          --skip-duplicate

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: ${{ env.PACKAGE_OUTPUT_DIR }}/*.nupkg
        generate_release_notes: true
        prerelease: ${{ contains(github.ref_name, '-') }}  # 如果标签包含 '-'，则标记为预发布
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}