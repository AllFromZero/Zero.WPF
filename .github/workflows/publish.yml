name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  PACKAGE_OUTPUT_DIR: '${{ github.workspace }}/output'
  NUGET_SOURCE: 'https://api.nuget.org/v3/index.json'

jobs:
  build-and-publish:
    name: Build, Pack, and Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 🔍 调试：列出所有文件，确认项目文件位置
    - name: Debug - List files
      run: |
        echo "Current directory: $(pwd)"
        echo "Files in root:"
        ls -la
        echo "All .csproj files:"
        find . -name "*.csproj"

    # 🔍 自动查找项目文件
    - name: Find project file
      id: find_project
      run: |
        PROJECT=$(find . -name "*.csproj" -not -path "./.github/*" | head -1)
        if [ -z "$PROJECT" ]; then
          echo "❌ No .csproj file found!"
          exit 1
        fi
        echo "✅ Found project: $PROJECT"
        echo "project_path=$PROJECT" >> $GITHUB_OUTPUT

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Cache NuGet packages
      uses: actions/cache@v3
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore ${{ steps.find_project.outputs.project_path }}

    - name: Run tests (optional)
      run: dotnet test ${{ steps.find_project.outputs.project_path }} --no-restore --verbosity normal || true

    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

    - name: Build and Pack
      run: |
        dotnet pack ${{ steps.find_project.outputs.project_path }} \
          --configuration Release \
          --no-build \
          --output ${{ env.PACKAGE_OUTPUT_DIR }} \
          -p:PackageVersion=${{ steps.get_version.outputs.VERSION }} \
          -p:IncludeSymbols=true \
          -p:SymbolPackageFormat=snupkg \
          -p:ContinuousIntegrationBuild=true

    - name: Push to NuGet.org (OIDC)
      run: |
        dotnet nuget push "${{ env.PACKAGE_OUTPUT_DIR }}/*.nupkg" \
          --source ${{ env.NUGET_SOURCE }} \
          --skip-duplicate

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: ${{ env.PACKAGE_OUTPUT_DIR }}/*.nupkg
        generate_release_notes: true
        prerelease: ${{ contains(github.ref_name, '-') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}