name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  PROJECT_FOLDER: 'Zero.WPF'
  PROJECT_FILE: 'Zero.WPF.csproj'
  PACKAGE_OUTPUT_DIR: '${{ github.workspace }}/output'
  NUGET_SOURCE: 'https://api.nuget.org/v3/index.json'

jobs:
  build-and-publish:
    name: Build, Pack, and Publish
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        include-prerelease: true

    - name: Cache NuGet packages
      uses: actions/cache@v3
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore ${{ env.PROJECT_FOLDER }}/${{ env.PROJECT_FILE }}

    - name: Run tests (optional)
      run: dotnet test ${{ env.PROJECT_FOLDER }}/${{ env.PROJECT_FILE }} --no-restore --verbosity normal || true

    - name: Get version from tag
      id: get_version
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        echo "✅ Extracted version: $VERSION"
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "version=$VERSION" >> $GITHUB_OUTPUT
      shell: bash

    # 🔨 构建（使用完整相对路径）
    - name: Build project
      run: |
        dotnet build ${{ env.PROJECT_FOLDER }}/${{ env.PROJECT_FILE }} --configuration Release --verbosity normal
      shell: bash

    # 🔍 验证 DLL
    - name: Verify DLL exists
      run: |
        if exist "${{ env.PROJECT_FOLDER }}\bin\Release\net10.0-windows\Zero.WPF.dll" (
          echo "✅ DLL found"
          dir "${{ env.PROJECT_FOLDER }}\bin\Release\net10.0-windows"
        ) else (
          echo "❌ DLL not found"
          dir ${{ env.PROJECT_FOLDER }}\bin\Release || echo "No Release folder"
          exit 1
        )
      shell: cmd

    # 📦 打包（同样使用完整路径）
    - name: Pack
      run: |
        VERSION="${{ steps.get_version.outputs.version }}"
        echo "📦 Packing version: $VERSION"
        dotnet pack "${{ env.PROJECT_FOLDER }}/${{ env.PROJECT_FILE }}" \
          --configuration Release \
          --no-build \
          --output "${{ env.PACKAGE_OUTPUT_DIR }}" \
          -p:PackageVersion=$VERSION \
          -p:IncludeSymbols=true \
          -p:SymbolPackageFormat=snupkg \
          -p:ContinuousIntegrationBuild=true
      shell: bash
      
    # ✅ 使用 PowerShell 列出目录，避免路径解析问题
    - name: List output directory
      run: |
        Write-Host "=== Contents of $env:PACKAGE_OUTPUT_DIR ==="
        Get-ChildItem -Path $env:PACKAGE_OUTPUT_DIR
      shell: pwsh

    # 🔍 调试：列出所有 .nupkg 文件
    - name: Find nupkg files
      run: |
        echo "Searching for .nupkg files..."
        find . -name "*.nupkg" -type f
      shell: bash

    # 🚀 推送：使用实际存在的路径（注意多了一层 PROJECT_FOLDER）
    - name: Push to NuGet.org (OIDC)
      run: |
        # 尝试多个可能的路径
        PACKAGE_PATH="${{ github.workspace }}/${{ env.PROJECT_FOLDER }}/output/*.nupkg"
        if ls $PACKAGE_PATH 1> /dev/null 2>&1; then
          echo "Found packages at $PACKAGE_PATH"
          dotnet nuget push "$PACKAGE_PATH" \
            --api-key azure \
            --source ${{ env.NUGET_SOURCE }} \
            --skip-duplicate
        else
          echo "Trying root output path..."
          PACKAGE_PATH2="${{ github.workspace }}/output/*.nupkg"
          if ls $PACKAGE_PATH2 1> /dev/null 2>&1; then
            dotnet nuget push "$PACKAGE_PATH2" \
              --api-key azure \
              --source ${{ env.NUGET_SOURCE }} \
              --skip-duplicate
          else
            echo "❌ No .nupkg files found."
            exit 1
          fi
        fi
      shell: bash

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: ${{ env.PACKAGE_OUTPUT_DIR }}/*.nupkg
        generate_release_notes: true
        prerelease: ${{ contains(github.ref_name, '-') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}