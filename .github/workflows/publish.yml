name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  PROJECT_FOLDER: 'Zero.WPF'
  PROJECT_FILE: 'Zero.WPF.csproj'
  PACKAGE_OUTPUT_DIR: '${{ github.workspace }}/output'
  NUGET_SOURCE: 'https://api.nuget.org/v3/index.json'

jobs:
  build-and-publish:
    name: Build, Pack, and Publish
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        include-prerelease: true

    - name: Cache NuGet packages
      uses: actions/cache@v3
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    # 🔧 修复1：单独还原，强制刷新并输出详细信息
    - name: Restore dependencies
      run: |
        dotnet restore "${{ env.PROJECT_FOLDER }}/${{ env.PROJECT_FILE }}" \
          --force \
          --verbosity detailed
      shell: bash

    # 🔧 修复2：获取版本号（移到构建前，确保后续步骤可用）
    - name: Get version from tag
      id: get_version
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        echo "✅ Extracted version: $VERSION"
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "version=$VERSION" >> $GITHUB_OUTPUT
      shell: bash

    # 🔧 修复3：构建时跳过还原，使用已有缓存
    - name: Build project
      run: |
        dotnet build "${{ env.PROJECT_FOLDER }}/${{ env.PROJECT_FILE }}" \
          --configuration Release \
          --no-restore \
          --verbosity normal
      shell: bash

    # 🔧 修复4：验证 DLL 是否存在
    - name: Verify DLL exists
      run: |
        if exist "${{ env.PROJECT_FOLDER }}\bin\Release\net10.0-windows\Zero.WPF.dll" (
          echo "✅ DLL found"
          dir "${{ env.PROJECT_FOLDER }}\bin\Release\net10.0-windows"
        ) else (
          echo "❌ DLL not found"
          dir ${{ env.PROJECT_FOLDER }}\bin\Release || echo "No Release folder"
          exit 1
        )
      shell: cmd

    # 🔧 修复5：打包时使用 --no-build，基于已构建的产物
    - name: Pack
      run: |
        VERSION="${{ steps.get_version.outputs.version }}"
        echo "📦 Packing version: $VERSION"
        dotnet pack "${{ env.PROJECT_FOLDER }}/${{ env.PROJECT_FILE }}" \
          --configuration Release \
          --no-build \
          --output "${{ env.PACKAGE_OUTPUT_DIR }}" \
          -p:PackageVersion=$VERSION \
          -p:IncludeSymbols=true \
          -p:SymbolPackageFormat=snupkg \
          -p:ContinuousIntegrationBuild=true
      shell: bash

    # 🔧 修复6：列出输出目录（使用 PowerShell，更可靠）
    - name: List output directory
      run: |
        Write-Host "=== Contents of $env:PACKAGE_OUTPUT_DIR ==="
        Get-ChildItem -Path $env:PACKAGE_OUTPUT_DIR -Force
      shell: pwsh
      env:
        PACKAGE_OUTPUT_DIR: ${{ env.PACKAGE_OUTPUT_DIR }}

    # 🔧 修复7：推送时使用 OIDC + 占位符 API Key
    - name: Push to NuGet.org (OIDC)
      run: |
        echo "Pushing packages from ${{ env.PACKAGE_OUTPUT_DIR }}"
        dotnet nuget push "${{ env.PACKAGE_OUTPUT_DIR }}/*.nupkg" \
          --api-key azure \
          --source ${{ env.NUGET_SOURCE }} \
          --skip-duplicate
      shell: bash

    # 🔧 修复8：创建 GitHub Release
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: ${{ env.PACKAGE_OUTPUT_DIR }}/*.nupkg
        generate_release_notes: true
        prerelease: ${{ contains(github.ref_name, '-') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}