name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  PROJECT_PATH: 'Zero.WPF/Zero.WPF.csproj'
  PACKAGE_OUTPUT_DIR: '${{ github.workspace }}/output'
  NUGET_SOURCE: 'https://api.nuget.org/v3/index.json'

jobs:
  build-and-publish:
    name: Build, Pack, and Publish
    runs-on: windows-latest   # ✅ 使用 Windows 运行器
    permissions:
      contents: write
      id-token: write          # 用于 NuGet Trusted Publishing (OIDC)

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Cache NuGet packages
      uses: actions/cache@v3
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore ${{ env.PROJECT_PATH }}

    - name: Run tests (optional)
      run: dotnet test ${{ env.PROJECT_PATH }} --no-restore --verbosity normal || true

    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${env:GITHUB_REF_NAME#v}" >> $env:GITHUB_OUTPUT
      # 注意：Windows 上环境变量语法略有不同，但也可以用 bash 脚本（如果运行器默认是 PowerShell，建议改用 pwsh）
      # 更稳妥的方式：使用 PowerShell 或直接使用 bash（git bash 在 Windows 也可用）
      # 这里使用 bash 运行（默认 Windows 运行器也支持 bash）
      shell: bash

    - name: Build and Pack
      run: |
        dotnet pack ${{ env.PROJECT_PATH }} \
          --configuration Release \
          --no-build \
          --output ${{ env.PACKAGE_OUTPUT_DIR }} \
          -p:PackageVersion=${{ steps.get_version.outputs.VERSION }} \
          -p:IncludeSymbols=true \
          -p:SymbolPackageFormat=snupkg \
          -p:ContinuousIntegrationBuild=true
      shell: bash

    - name: Push to NuGet.org (OIDC)
      run: |
        dotnet nuget push "${{ env.PACKAGE_OUTPUT_DIR }}/*.nupkg" \
          --source ${{ env.NUGET_SOURCE }} \
          --skip-duplicate
      shell: bash

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: ${{ env.PACKAGE_OUTPUT_DIR }}/*.nupkg
        generate_release_notes: true
        prerelease: ${{ contains(github.ref_name, '-') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}