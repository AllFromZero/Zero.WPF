name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  PROJECT_PATH: 'Zero.WPF/Zero.WPF.csproj'
  PACKAGE_OUTPUT_DIR: '${{ github.workspace }}/output'
  NUGET_SOURCE: 'https://api.nuget.org/v3/index.json'

jobs:
  build-and-publish:
    name: Build, Pack, and Publish
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Cache NuGet packages
      uses: actions/cache@v3
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore ${{ env.PROJECT_PATH }}

    - name: Run tests (optional)
      run: dotnet test ${{ env.PROJECT_PATH }} --no-restore --verbosity normal || true

    # ✅ 增强版本提取步骤
    - name: Get version from tag
      id: get_version
      run: |
        # 去掉前缀 'v'
        VERSION=${GITHUB_REF_NAME#v}
        if [ -z "$VERSION" ]; then
          echo "❌ Error: GITHUB_REF_NAME is empty or does not start with 'v'"
          exit 1
        fi
        echo "✅ Extracted version: $VERSION"
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "version=$VERSION" >> $GITHUB_OUTPUT
      shell: bash

    - name: Build and Pack
      run: |
        # 从输出获取版本，如果为空则使用环境变量作为后备
        VERSION="${{ steps.get_version.outputs.version }}"
        if [ -z "$VERSION" ]; then
          VERSION="${{ env.VERSION }}"
        fi
        if [ -z "$VERSION" ]; then
          echo "❌ Error: No version available"
          exit 1
        fi
        echo "📦 Packing version: $VERSION"
        dotnet pack ${{ env.PROJECT_PATH }} \
          --configuration Release \
          --no-build \
          --output ${{ env.PACKAGE_OUTPUT_DIR }} \
          -p:PackageVersion=$VERSION \
          -p:IncludeSymbols=true \
          -p:SymbolPackageFormat=snupkg \
          -p:ContinuousIntegrationBuild=true
      shell: bash

    - name: Push to NuGet.org (OIDC)
      run: |
        dotnet nuget push "${{ env.PACKAGE_OUTPUT_DIR }}/*.nupkg" \
          --source ${{ env.NUGET_SOURCE }} \
          --skip-duplicate
      shell: bash

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: ${{ env.PACKAGE_OUTPUT_DIR }}/*.nupkg
        generate_release_notes: true
        prerelease: ${{ contains(github.ref_name, '-') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}