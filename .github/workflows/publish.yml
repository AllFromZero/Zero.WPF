name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  PROJECT_FOLDER: 'Zero.WPF'
  PROJECT_FILE: 'Zero.WPF.csproj'
  PACKAGE_OUTPUT_DIR: '${{ github.workspace }}/output'
  NUGET_SOURCE: 'https://api.nuget.org/v3/index.json'

jobs:
  build-and-publish:
    name: Build, Pack, and Publish
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        include-prerelease: true

    - name: Cache NuGet packages
      uses: actions/cache@v3
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore ${{ env.PROJECT_FOLDER }}/${{ env.PROJECT_FILE }}

    - name: Run tests (optional)
      run: dotnet test ${{ env.PROJECT_FOLDER }}/${{ env.PROJECT_FILE }} --no-restore --verbosity normal || true

    - name: Get version from tag
      id: get_version
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        echo "✅ Extracted version: $VERSION"
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "version=$VERSION" >> $GITHUB_OUTPUT
      shell: bash

    # 🔍 诊断：列出构建输出目录
    - name: List build output (diagnostic)
      run: |
        echo "=== Listing ${{ env.PROJECT_FOLDER }}/bin/Release ==="
        dir /s ${{ env.PROJECT_FOLDER }}\bin\Release || echo "Directory not found"
      shell: cmd

    - name: Build and Pack
      run: |
        cd ${{ env.PROJECT_FOLDER }}
        VERSION="${{ steps.get_version.outputs.version }}"
        echo "📦 Packing version: $VERSION"
        dotnet pack ${{ env.PROJECT_FILE }} \
          --configuration Release \
          --output ${{ env.PACKAGE_OUTPUT_DIR }} \
          -p:PackageVersion=$VERSION \
          -p:IncludeSymbols=true \
          -p:SymbolPackageFormat=snupkg \
          -p:ContinuousIntegrationBuild=true
      shell: bash

    - name: Push to NuGet.org (OIDC)
      run: |
        dotnet nuget push "${{ env.PACKAGE_OUTPUT_DIR }}/*.nupkg" \
          --source ${{ env.NUGET_SOURCE }} \
          --skip-duplicate
      shell: bash

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: ${{ env.PACKAGE_OUTPUT_DIR }}/*.nupkg
        generate_release_notes: true
        prerelease: ${{ contains(github.ref_name, '-') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}